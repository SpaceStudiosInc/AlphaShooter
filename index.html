<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Lane Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            overflow-x: hidden;
            user-select: none;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #gameArea {
            position: relative;
            width: 100%;
            max-width: 720px;
            aspect-ratio: 9 / 16;
            background: #ffffff;
            overflow: hidden;
            border-radius: 14px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
            border: 2px solid #000000;
        }

        #laneGuides {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 6;
        }

        .lane-guide {
            position: absolute;
            top: 0;
            bottom: 44px;
            width: 2px;
            background: rgba(0, 0, 0, 0.12);
            transform: translateX(-1px);
        }

        /* HUD / UI */

        #gameUI {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            z-index: 100;
            pointer-events: none;
        }

        .ui-panel {
            background: rgba(255, 255, 255, 0.92);
            padding: 10px 12px;
            border-radius: 12px;
            border: 2px solid #000000;
            font-size: 13px;
            letter-spacing: 0.5px;
            backdrop-filter: blur(6px);
        }

        #score {
            font-size: 16px;
            font-weight: 700;
            color: #000000;
            text-shadow: none;
        }

        #distance,
        #health {
            margin-top: 4px;
            font-size: 13px;
        }

        /* World */

        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 44px;
            background: rgba(0, 0, 0, 0.04);
            border-top: 2px solid #000000;
            z-index: 5;
        }

        .platform {
            position: absolute;
            background: rgba(0, 0, 0, 0.06);
            z-index: 10;
            border-radius: 10px;
        }

        .obstacle {
            position: absolute;
            background: #ffffff;
            z-index: 20;
            border-radius: 10px;
            border: 3px solid #000000;
        }

        .obstacle.breakable {
            background: #ffffff;
            border: 3px dashed #000000;
        }

        /* Player & Enemies */

        #player {
            position: absolute;
            width: 36px;
            height: 52px;
            background: #ffffff;
            z-index: 50;
            border-radius: 12px;
            border: 3px solid #000000;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
            will-change: transform, left, top;
        }

        #player::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 26px;
            background: #000000;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 6px;
        }

        #player::before {
            content: "";
            position: absolute;
            width: 16px;
            height: 12px;
            background: #000000;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 8px;
        }

        .enemy {
            position: absolute;
            width: 34px;
            height: 50px;
            background: #ffffff;
            z-index: 45;
            border-radius: 12px;
            border: 3px solid #000000;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
        }

        .enemy.shooter::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 16px;
            background: #000000;
            left: 50%;
            top: -14px;
            transform: translateX(-50%);
            border-radius: 6px;
        }

        .enemy::before,
        .enemy::after {
            content: "";
            position: absolute;
            width: 6px;
            height: 6px;
            background: #000000;
            top: 14px;
            border-radius: 50%;
        }

        .enemy::before {
            left: 9px;
        }
        .enemy::after {
            right: 9px;
        }

        /* Bullets */

        .bullet {
            position: absolute;
            width: 6px;
            height: 12px;
            background: #000000;
            border-radius: 6px;
            z-index: 60;
        }

        .enemy-bullet {
            position: absolute;
            width: 6px;
            height: 12px;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 6px;
            z-index: 55;
        }

        /* Screens */

        #startScreen,
        #gameOverScreen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.92);
            z-index: 200;
            text-align: center;
            padding: 16px;
        }

        #gameOverScreen {
            display: none;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            margin: 4px 0;
        }

        button {
            margin-top: 18px;
            padding: 10px 22px;
            font-size: 14px;
            background: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 0.6px;
        }

        button:active {
            transform: translateY(1px);
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 40px;
            }

            #score {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div id="gameArea">
        <div id="gameUI">
            <div class="ui-panel">
                <div id="score">SCORE: 0</div>
                <div id="distance">DISTANCE: 0m</div>
                <div id="health">HEALTH: 100%</div>
            </div>
        </div>

        <div id="laneGuides"></div>

        <div id="ground"></div>
        <div id="player"></div>

        <div id="startScreen">
            <h1>LANE RUNNER</h1>
            <p>3 lanes. Switch lanes to dodge.</p>
            <p>Shoot enemies and breakable walls.</p>
            <p style="margin-top: 10px; font-size: 13px; opacity: 0.85">
                Mobile: tap LEFT / RIGHT to change lanes, tap CENTER to shoot
            </p>
            <p style="font-size: 13px; opacity: 0.85">
                Desktop: A/D or arrows to change lanes, X or SPACE to shoot
            </p>
            <button id="startBtn">START</button>
        </div>

        <div id="gameOverScreen">
            <h1>GAME OVER</h1>
            <p id="finalScore">Score: 0</p>
            <p id="finalDistance">Distance: 0m</p>
            <button id="restartBtn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // Core state
        let score = 0;
        let distance = 0;
        let gameActive = false;
        let isGameOver = false;

        let playerX = 80;
        let playerY = 0;

        let enemies = [];
        let bullets = [];
        let obstacles = [];

        // Three-lane system (left / middle / right within play area)
        let lanePositions = [];
        let currentLane = 1; // 0 = left, 1 = middle, 2 = right
        let playerTargetX = 0;
        let lastEnemyLane = -1;
        let lastWallLane = -1;
        let laneSpacingPx = 0;

        // Enforce "enemy and wall never share the same lane" at runtime
        // Values: null | 'enemy' | 'wall'
        let laneOccupiedBy = [null, null, null];

        let invulnerableUntil = 0;
        let invulnTimeout = null;

        let lastShotTime = 0;
        let shotDelay = 190;
        let gameSpeed = 2.6;
        let scrollX = 0;
        let waveSpacing = 520;
        let nextWaveAt = 0;

        // DOM refs
        const gameArea = document.getElementById("gameArea");
        const scoreElement = document.getElementById("score");
        const distanceElement = document.getElementById("distance");
        const healthElement = document.getElementById("health");
        const player = document.getElementById("player");
        const ground = document.getElementById("ground");
        const laneGuides = document.getElementById("laneGuides");
        const startScreen = document.getElementById("startScreen");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const finalScore = document.getElementById("finalScore");
        const finalDistance = document.getElementById("finalDistance");

        let health = 100;
        const groundHeight = 44;
        const playerWidth = 36;
        const playerHeight = 52;

        // Keyboard input
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            a: false,
            d: false,
            " ": false,
            x: false
        };

        function updateLaneGuides() {
            if (!laneGuides) return;
            if (lanePositions.length !== 3) return;

            // Ensure exactly 3 guide lines
            while (laneGuides.children.length < 3) {
                const el = document.createElement("div");
                el.className = "lane-guide";
                laneGuides.appendChild(el);
            }
            while (laneGuides.children.length > 3) {
                laneGuides.lastChild.remove();
            }

            for (let i = 0; i < 3; i++) {
                laneGuides.children[i].style.left = lanePositions[i] + "px";
            }
        }

        function updateHealth() {
            healthElement.textContent = "HEALTH: " + health + "%";
        }

        function takeDamage(amount) {
            if (isGameOver) return;
            const now = Date.now();
            if (now < invulnerableUntil) return;
            // Slightly reduce incoming damage for a more forgiving feel
            health = Math.max(0, health - Math.round(amount * 0.75));
            updateHealth();

            invulnerableUntil = now + 650;
            player.style.opacity = "0.55";
            player.style.transform = "scale(0.98)";
            if (invulnTimeout) {
                clearTimeout(invulnTimeout);
            }
            invulnTimeout = setTimeout(() => {
                player.style.opacity = "1";
                player.style.transform = "none";
            }, 650);

            if (health <= 0) {
                endGame();
            }
        }

        function resetState() {
            score = 0;
            distance = 0;
            health = 100;
            gameActive = true;
            isGameOver = false;

            const h = gameArea.clientHeight || window.innerHeight;
            const w = gameArea.clientWidth || window.innerWidth;

            // Tight, centered lanes (left / middle / right)
            const laneCenter = w / 2;
            const laneSpacing = Math.min(86, Math.floor(w * 0.12));
            lanePositions = [
                laneCenter - laneSpacing,
                laneCenter,
                laneCenter + laneSpacing
            ];
            laneSpacingPx = laneSpacing;
            currentLane = 1;

            updateLaneGuides();

            playerX = lanePositions[currentLane] - playerWidth / 2;
            playerTargetX = playerX;
            playerY = h - groundHeight - playerHeight - 18;

            lastEnemyLane = -1;
            lastWallLane = -1;
            nextWaveAt = 0;
            invulnerableUntil = 0;
            laneOccupiedBy = [null, null, null];
            if (invulnTimeout) {
                clearTimeout(invulnTimeout);
                invulnTimeout = null;
            }
            player.style.opacity = "1";
            player.style.transform = "none";

            enemies.forEach(e => e.element.remove());
            bullets.forEach(b => b.element.remove());
            obstacles.forEach(o => o.element.remove());

            enemies = [];
            bullets = [];
            obstacles = [];

            lastShotTime = 0;
            gameSpeed = 2.6;
            scrollX = 0;
            waveSpacing = 520;

            scoreElement.textContent = "SCORE: 0";
            distanceElement.textContent = "DISTANCE: 0m";
            updateHealth();
            ground.style.left = "0px";

            createInitialPlatforms();
        }

        // Input handlers
        function handleKeyDown(e) {
            if (!keys.hasOwnProperty(e.key)) return;

            // Instant lane switching on press (debounced so holding doesn't spam)
            if (!keys[e.key]) {
                if (e.key === "ArrowLeft" || e.key === "a") {
                    currentLane = Math.max(0, currentLane - 1);
                    if (lanePositions.length === 3) {
                        playerTargetX = lanePositions[currentLane] - playerWidth / 2;
                    }
                } else if (e.key === "ArrowRight" || e.key === "d") {
                    currentLane = Math.min(2, currentLane + 1);
                    if (lanePositions.length === 3) {
                        playerTargetX = lanePositions[currentLane] - playerWidth / 2;
                    }
                }
            }

            keys[e.key] = true;
            e.preventDefault();
        }

        function handleKeyUp(e) {
            if (!keys.hasOwnProperty(e.key)) return;
            keys[e.key] = false;
            e.preventDefault();
        }

        function shoot() {
            const now = Date.now();
            if (now - lastShotTime < shotDelay || !gameActive || isGameOver) return;
            lastShotTime = now;

            const rect = player.getBoundingClientRect();
            const gameRect = gameArea.getBoundingClientRect();

            const bulletEl = document.createElement("div");
            bulletEl.className = "bullet";
            const startX = rect.left + rect.width / 2 - gameRect.left - 3;
            const startY = rect.top - gameRect.top - 14;
            bulletEl.style.left = startX + "px";
            bulletEl.style.top = startY + "px";
            gameArea.appendChild(bulletEl);

            bullets.push({
                element: bulletEl,
                x: startX,
                y: startY,
                vx: 0,
                vy: -10.5,
                fromEnemy: false
            });
        }

        function updatePlayerPosition() {
            const h = gameArea.clientHeight;

            if (lanePositions.length === 3) {
                // Smooth slide towards target lane
                const t = 0.22;
                playerX = playerX + (playerTargetX - playerX) * t;
            }
            playerY = h - groundHeight - playerHeight - 18;

            player.style.left = playerX + "px";
            player.style.top = playerY + "px";
        }

        function enemyShoot(enemy) {
            const bulletEl = document.createElement("div");
            bulletEl.className = "enemy-bullet";
            bulletEl.style.left = (enemy.x + 14) + "px";
            bulletEl.style.top = (enemy.y + 52) + "px";
            gameArea.appendChild(bulletEl);

            bullets.push({
                element: bulletEl,
                x: enemy.x + 14,
                y: enemy.y + 52,
                vx: 0,
                vy: 6.5,
                fromEnemy: true
            });
        }

        function updateBullets() {
            const w = gameArea.clientWidth;
            const h = gameArea.clientHeight;

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.element.style.left = b.x + "px";
                b.element.style.top = b.y + "px";

                if (b.y < -60 || b.y > h + 60 || b.x < -60 || b.x > w + 60) {
                    b.element.remove();
                    bullets.splice(i, 1);
                    continue;
                }

                const br = b.element.getBoundingClientRect();
                const pr = player.getBoundingClientRect();

                if (b.fromEnemy) {
                    if (
                        br.left < pr.right &&
                        br.right > pr.left &&
                        br.top < pr.bottom &&
                        br.bottom > pr.top
                    ) {
                        takeDamage(10);
                        b.element.remove();
                        bullets.splice(i, 1);
                        continue;
                    }
                } else {
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const e = enemies[j];
                        const er = e.element.getBoundingClientRect();
                        if (
                            br.left < er.right &&
                            br.right > er.left &&
                            br.top < er.bottom &&
                            br.bottom > er.top
                        ) {
                            e.health -= 1;
                            if (e.health <= 0) {
                                score += e.isShooter ? 60 : 30;
                                scoreElement.textContent = "SCORE: " + score;
                                if (e.laneIndex !== undefined && laneOccupiedBy[e.laneIndex] === 'enemy') {
                                    laneOccupiedBy[e.laneIndex] = null;
                                }
                                e.element.remove();
                                enemies.splice(j, 1);
                            }
                            b.element.remove();
                            bullets.splice(i, 1);
                            break;
                        }
                    }

                    for (let k = obstacles.length - 1; k >= 0; k--) {
                        const o = obstacles[k];
                        if (!o.breakable) continue;
                        if (b.x + 5 > o.x && b.x + 5 < o.x + o.width && b.y > o.y && b.y < o.y + o.height) {
                            if (o.laneIndex !== undefined && laneOccupiedBy[o.laneIndex] === 'wall') {
                                laneOccupiedBy[o.laneIndex] = null;
                            }
                            o.element.remove();
                            obstacles.splice(k, 1);
                            score += 20;
                            scoreElement.textContent = "SCORE: " + score;
                            b.element.remove();
                            bullets.splice(i, 1);
                            break;
                        }
                    }
                }
            }
        }

        function updateEnemies() {
            const now = Date.now();
            const h = gameArea.clientHeight;
            const pr = player.getBoundingClientRect();

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.y += e.speed + (gameSpeed * 0.55);
                e.element.style.top = e.y + "px";

                if (e.isShooter && now - e.lastShot > e.shootDelay) {
                    e.lastShot = now;
                    enemyShoot(e);
                }

                if (e.y > h + 80) {
                    if (e.laneIndex !== undefined && laneOccupiedBy[e.laneIndex] === 'enemy') {
                        laneOccupiedBy[e.laneIndex] = null;
                    }
                    e.element.remove();
                    enemies.splice(i, 1);
                    continue;
                }

                const er = e.element.getBoundingClientRect();
                if (
                    er.left < pr.right &&
                    er.right > pr.left &&
                    er.top < pr.bottom &&
                    er.bottom > pr.top
                ) {
                    takeDamage(16);
                    if (e.laneIndex !== undefined && laneOccupiedBy[e.laneIndex] === 'enemy') {
                        laneOccupiedBy[e.laneIndex] = null;
                    }
                    e.element.remove();
                    enemies.splice(i, 1);
                }
            }
        }

        function spawnEnemy(laneIndex) {
            if (lanePositions.length !== 3) return;

            if (laneOccupiedBy[laneIndex] !== null) return;

            const enemyW = 34;
            const laneX = lanePositions[laneIndex] - enemyW / 2;

            const enemyEl = document.createElement("div");
            const isShooter = Math.random() < 0.55;
            enemyEl.className = "enemy" + (isShooter ? " shooter" : "");
            enemyEl.style.left = laneX + "px";
            enemyEl.style.top = "-80px";
            gameArea.appendChild(enemyEl);

            enemies.push({
                element: enemyEl,
                x: laneX,
                y: -80,
                laneIndex,
                speed: 1.6 + Math.random() * 1.0,
                health: isShooter ? 2 : 1,
                isShooter,
                lastShot: 0,
                shootDelay: 900 + Math.random() * 900
            });

            laneOccupiedBy[laneIndex] = 'enemy';
        }

        function createWall(laneIndex, breakable) {
            if (lanePositions.length !== 3) return;

            if (laneOccupiedBy[laneIndex] !== null) return;

            // Horizontal wall segment that blocks ONE lane
            const wallW = Math.max(56, Math.floor(laneSpacingPx * 0.9));
            const laneX = lanePositions[laneIndex] - wallW / 2;
            const el = document.createElement("div");
            el.className = "obstacle" + (breakable ? " breakable" : "");

            const w = wallW;
            const h = 18 + Math.random() * 10;
            el.style.width = w + "px";
            el.style.height = h + "px";
            el.style.left = laneX + "px";
            el.style.top = "-" + (h + 40) + "px";
            gameArea.appendChild(el);

            obstacles.push({ x: laneX, y: -(h + 40), width: w, height: h, breakable, element: el, laneIndex });

            laneOccupiedBy[laneIndex] = 'wall';
        }

        function createInitialPlatforms() {
            // No platforms in the vertical lane runner.
        }

        function updateObstaclesAndPlatforms() {
            const h = gameArea.clientHeight;
            const pr = player.getBoundingClientRect();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.y += (gameSpeed + 1.3);
                o.element.style.top = o.y + "px";

                if (o.y > h + 120) {
                    if (o.laneIndex !== undefined && laneOccupiedBy[o.laneIndex] === 'wall') {
                        laneOccupiedBy[o.laneIndex] = null;
                    }
                    o.element.remove();
                    obstacles.splice(i, 1);
                    continue;
                }

                if (!o.breakable) {
                    const or = o.element.getBoundingClientRect();
                    if (
                        or.left < pr.right &&
                        or.right > pr.left &&
                        or.top < pr.bottom &&
                        or.bottom > pr.top
                    ) {
                        takeDamage(12);
                        if (o.laneIndex !== undefined && laneOccupiedBy[o.laneIndex] === 'wall') {
                            laneOccupiedBy[o.laneIndex] = null;
                        }
                        o.element.remove();
                        obstacles.splice(i, 1);
                    }
                }
            }
        }

        function spawnWorldFeatures() {
            if (lanePositions.length !== 3) return;

            if (scrollX < nextWaveAt) return;
            nextWaveAt = scrollX + waveSpacing;

            // Only spawn into free lanes.
            const freeLanes = [0, 1, 2].filter(i => laneOccupiedBy[i] === null);
            if (freeLanes.length < 2) return;

            const enemyLane = freeLanes[Math.floor(Math.random() * freeLanes.length)];
            const wallLaneOptions = freeLanes.filter(i => i !== enemyLane);
            const wallLane = wallLaneOptions[Math.floor(Math.random() * wallLaneOptions.length)];

            lastEnemyLane = enemyLane;
            lastWallLane = wallLane;

            // Always spawn a wall + enemy in different lanes
            createWall(wallLane, Math.random() < 0.75);
            spawnEnemy(enemyLane);

            // Slightly speed up / tighten over time (polished ramp)
            if (waveSpacing > 340) {
                waveSpacing -= 2.5;
            }
        }

        function updateWorld() {
            scrollX += gameSpeed;
            distance = Math.floor(scrollX / 10);
            distanceElement.textContent = "DISTANCE: " + distance + "m";

            ground.style.left = "0px";

            if (scrollX % 700 === 0 && gameSpeed < 7) {
                gameSpeed += 0.14;
            }
        }

        function gameLoop() {
            if (!gameActive) return;
            updatePlayerPosition();
            updateWorld();
            updateBullets();
            updateEnemies();
            updateObstaclesAndPlatforms();
            spawnWorldFeatures();
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            if (isGameOver) return;
            isGameOver = true;
            gameActive = false;
            finalScore.textContent = "Score: " + score;
            finalDistance.textContent = "Distance: " + distance + "m";
            gameOverScreen.style.display = "flex";
        }

        function startGame() {
            startScreen.style.display = "none";
            gameOverScreen.style.display = "none";
            resetState();
            gameLoop();
        }

        // UI events
        document.getElementById("startBtn").addEventListener("click", startGame);
        document
            .getElementById("restartBtn")
            .addEventListener("click", startGame);

        // Mouse / touch controls (desktop + mobile)
        gameArea.addEventListener("mousedown", e => {
            if (!gameActive || isGameOver) return;
            if (e.button !== 0) return;

            const rect = gameArea.getBoundingClientRect();
            const localX = e.clientX - rect.left;
            const third = rect.width / 3;

            if (localX < third) {
                currentLane = Math.max(0, currentLane - 1);
            } else if (localX > third * 2) {
                currentLane = Math.min(2, currentLane + 1);
            } else {
                shoot();
            }

            if (lanePositions.length === 3) {
                playerTargetX = lanePositions[currentLane] - playerWidth / 2;
            }

            e.preventDefault();
        });

        gameArea.addEventListener(
            "touchstart",
            e => {
                if (!gameActive || isGameOver) return;
                const touch = e.touches[0];
                const rect = gameArea.getBoundingClientRect();
                const localX = touch.clientX - rect.left;
                const third = rect.width / 3;

                if (localX < third) {
                    currentLane = Math.max(0, currentLane - 1);
                } else if (localX > third * 2) {
                    currentLane = Math.min(2, currentLane + 1);
                } else {
                    shoot();
                }

                if (lanePositions.length === 3) {
                    playerTargetX = lanePositions[currentLane] - playerWidth / 2;
                }

                e.preventDefault();
            },
            { passive: false }
        );

        document.addEventListener(
            "touchmove",
            e => {
                if (gameActive && !isGameOver) {
                    e.preventDefault();
                }
            },
            { passive: false }
        );

        // Keyboard prevention of scroll
        window.addEventListener("keydown", e => {
            if (
                [
                    "ArrowLeft",
                    "ArrowRight",
                    " ",
                    "x",
                    "a",
                    "d"
                ].includes(e.key)
            ) {
                e.preventDefault();
            }
        });

        document.addEventListener("keydown", handleKeyDown);
        document.addEventListener("keyup", handleKeyUp);

        // Auto-fire when holding key
        setInterval(() => {
            if (gameActive && !isGameOver && (keys[" "] || keys.x)) {
                shoot();
            }
        }, shotDelay);

        // Resize
        function onResize() {
            if (!gameActive) return;
            const h = gameArea.clientHeight;
            const w = gameArea.clientWidth;

            const laneCenter = w / 2;
            const laneSpacing = Math.min(86, Math.floor(w * 0.12));
            lanePositions = [laneCenter - laneSpacing, laneCenter, laneCenter + laneSpacing];
            laneSpacingPx = laneSpacing;
            updateLaneGuides();
            playerX = lanePositions[currentLane] - playerWidth / 2;
            playerTargetX = playerX;
            playerY = h - groundHeight - playerHeight - 18;
        }
        window.addEventListener("resize", onResize);
    </script>
</body>
</html>
