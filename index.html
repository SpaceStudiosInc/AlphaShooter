<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airsoft Defense</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(to bottom, #1a1a2e 0%, #16213e 100%);
            overflow: hidden;
            cursor: crosshair;
        }

        #game {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .score-board {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 10px;
            z-index: 100;
        }

        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: #2d2d2d;
            border-top: 3px solid #444;
            z-index: 10;
        }

        .turret {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            z-index: 50;
        }

        .turret-base {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 20px;
            background: #4d4d4d;
            border: 2px solid #666;
            border-radius: 5px;
        }

        .turret-body {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 30px;
            background: #2d4a2b;
            border: 2px solid #4d8b3d;
            border-radius: 5px;
        }

        .turret-barrel {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 30px;
            background: #333;
            border: 1px solid #555;
            transform-origin: center bottom;
        }

        .enemy {
            position: absolute;
            width: 30px;
            height: 30px;
        }

        .enemy-sprite {
            width: 100%;
            height: 100%;
            background: #8b0000;
            border: 2px solid #ff0000;
            border-radius: 3px;
            position: relative;
        }

        .enemy-head {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: #d4a574;
            border: 1px solid #8b0000;
            border-radius: 50%;
        }

        .projectile {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffff00;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffff00;
            z-index: 40;
        }

        .explosion {
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #ff6600, #ff0000, transparent);
            border-radius: 50%;
            pointer-events: none;
            animation: explode 0.4s ease-out forwards;
            z-index: 45;
        }

        @keyframes explode {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }

        .hit-effect {
            position: absolute;
            font-size: 18px;
            font-weight: bold;
            color: #00ff00;
            animation: hitPop 0.6s ease-out forwards;
            pointer-events: none;
            z-index: 99;
        }

        @keyframes hitPop {
            0% {
                transform: scale(0.5) translateY(0);
                opacity: 1;
            }
            100% {
                transform: scale(1.5) translateY(-40px);
                opacity: 0;
            }
        }

        .trail {
            position: absolute;
            width: 2px;
            height: 10px;
            background: rgba(255, 255, 0, 0.5);
            pointer-events: none;
            z-index: 35;
            animation: trailFade 0.3s ease-out forwards;
        }

        @keyframes trailFade {
            to {
                opacity: 0;
            }
        }

        .start-screen, .end-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        h1 {
            color: #ffd700;
            font-size: 48px;
            margin-bottom: 30px;
            text-shadow: 3px 3px #ff4444;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            font-size: 20px;
            padding: 20px 40px;
            background: #4169e1;
            color: #fff;
            border: 4px solid #ffd700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #ffd700;
            color: #000;
            transform: scale(1.1);
        }

        .final-score {
            color: #fff;
            font-size: 24px;
            margin: 20px 0;
        }

        .timer {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            color: #00ff00;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 25px;
            border-radius: 10px;
            z-index: 100;
        }

        .health-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ffd700;
            border-radius: 5px;
            z-index: 100;
            overflow: hidden;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #00ff00);
            transition: width 0.3s;
        }

        .ammo-display {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffff00;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 10px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="game">
        <div class="start-screen" id="startScreen">
            <h1>AIRSOFT DEFENSE</h1>
            <p style="color: #fff; margin-bottom: 30px; font-size: 14px;">Defend the base!</p>
            <button onclick="startGame()">START</button>
        </div>

        <div class="score-board" id="scoreBoard" style="display: none;">
            SCORE: <span id="score">0</span>
        </div>

        <div class="timer" id="timer" style="display: none;">
            WAVE: <span id="wave">1</span>
        </div>

        <div class="ammo-display" id="ammoDisplay" style="display: none;">
            AMMO: <span id="ammo">999</span>
        </div>

        <div class="health-bar" id="healthBar" style="display: none;">
            <div class="health-fill" id="healthFill"></div>
        </div>

        <div id="gameArea"></div>

        <div class="turret" id="turret">
            <div class="turret-barrel" id="barrel"></div>
            <div class="turret-body"></div>
            <div class="turret-base"></div>
        </div>

        <div class="ground"></div>

        <div class="end-screen" id="endScreen" style="display: none;">
            <h1>GAME OVER!</h1>
            <div class="final-score">YOUR SCORE: <span id="finalScore">0</span></div>
            <div class="final-score">WAVES SURVIVED: <span id="finalWave">0</span></div>
            <button onclick="location.reload()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        let score = 0;
        let wave = 1;
        let health = 100;
        let ammo = 999;
        let gameActive = false;
        let spawnInterval;
        let enemiesInWave = 0;
        let enemiesRemaining = 0;
        let projectiles = [];
        let enemies = [];

        const gameArea = document.getElementById('gameArea');
        const barrel = document.getElementById('barrel');
        const turret = document.getElementById('turret');

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        // Aim turret at mouse
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            if (!gameActive) return;
            
            const turretRect = turret.getBoundingClientRect();
            const turretCenterX = turretRect.left + turretRect.width / 2;
            const turretCenterY = turretRect.top + 40;
            
            const angle = Math.atan2(e.clientY - turretCenterY, e.clientX - turretCenterX);
            barrel.style.transform = `translateX(-50%) rotate(${angle + Math.PI/2}rad)`;
        });

        // Shoot projectile
        document.addEventListener('click', (e) => {
            if (!gameActive || ammo <= 0) return;
            if (e.target.closest('button')) return;
            
            shoot(e.clientX, e.clientY);
        });

        function shoot(targetX, targetY) {
            ammo--;
            updateAmmo();
            
            const turretRect = turret.getBoundingClientRect();
            const startX = turretRect.left + turretRect.width / 2;
            const startY = turretRect.top + 10;
            
            const dx = targetX - startX;
            const dy = targetY - startY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            projectiles.push({
                x: startX,
                y: startY,
                vx: (dx / dist) * 15,
                vy: (dy / dist) * 15,
                element: createProjectile(startX, startY)
            });
        }

        function createProjectile(x, y) {
            const proj = document.createElement('div');
            proj.className = 'projectile';
            proj.style.left = x + 'px';
            proj.style.top = y + 'px';
            gameArea.appendChild(proj);
            return proj;
        }

        function updateProjectiles() {
            projectiles = projectiles.filter(proj => {
                proj.x += proj.vx;
                proj.y += proj.vy;
                
                proj.element.style.left = proj.x + 'px';
                proj.element.style.top = proj.y + 'px';
                
                // Create trail
                if (Math.random() > 0.5) {
                    const trail = document.createElement('div');
                    trail.className = 'trail';
                    trail.style.left = proj.x + 'px';
                    trail.style.top = proj.y + 'px';
                    gameArea.appendChild(trail);
                    setTimeout(() => trail.remove(), 300);
                }
                
                // Check collision with enemies
                let hit = false;
                enemies.forEach((enemy, idx) => {
                    if (hit) return;
                    
                    const dx = proj.x - (enemy.x + 15);
                    const dy = proj.y - (enemy.y + 15);
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 20) {
                        hit = true;
                        
                        score += 100;
                        updateScore();
                        
                        createExplosion(enemy.x + 15, enemy.y + 15);
                        showHitEffect(enemy.x + 15, enemy.y + 15, '+100');
                        
                        enemy.element.remove();
                        enemies.splice(idx, 1);
                        
                        enemiesRemaining--;
                        checkWaveComplete();
                    }
                });
                
                if (hit) {
                    proj.element.remove();
                    return false;
                }
                
                // Remove if off screen
                if (proj.x < 0 || proj.x > window.innerWidth || 
                    proj.y < 0 || proj.y > window.innerHeight) {
                    proj.element.remove();
                    return false;
                }
                
                return true;
            });
        }

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('scoreBoard').style.display = 'block';
            document.getElementById('timer').style.display = 'block';
            document.getElementById('healthBar').style.display = 'block';
            document.getElementById('ammoDisplay').style.display = 'block';
            
            score = 0;
            wave = 1;
            health = 100;
            ammo = 999;
            gameActive = true;
            
            updateScore();
            updateWave();
            updateHealth();
            updateAmmo();
            
            startWave();
            gameLoop();
        }

        function gameLoop() {
            if (!gameActive) return;
            
            updateProjectiles();
            updateEnemies();
            
            requestAnimationFrame(gameLoop);
        }

        function startWave() {
            enemiesInWave = 8 + (wave - 1) * 4;
            enemiesRemaining = enemiesInWave;
            
            let spawnDelay = Math.max(300, 1500 - (wave * 80));
            let spawned = 0;
            
            spawnInterval = setInterval(() => {
                if (!gameActive) {
                    clearInterval(spawnInterval);
                    return;
                }
                
                spawnEnemy();
                
                spawned++;
                if (spawned >= enemiesInWave) {
                    clearInterval(spawnInterval);
                }
            }, spawnDelay);
        }

        function nextWave() {
            wave++;
            updateWave();
            setTimeout(() => {
                if (gameActive) startWave();
            }, 2000);
        }

        function spawnEnemy() {
            if (!gameActive) return;
            
            const x = Math.random() * (window.innerWidth - 40);
            
            const element = document.createElement('div');
            element.className = 'enemy';
            element.style.left = x + 'px';
            element.style.top = '-40px';
            element.innerHTML = `
                <div class="enemy-head"></div>
                <div class="enemy-sprite"></div>
            `;
            
            gameArea.appendChild(element);
            
            enemies.push({
                x: x,
                y: -40,
                speed: 1 + (wave * 0.15),
                element: element
            });
        }

        function updateEnemies() {
            enemies = enemies.filter(enemy => {
                enemy.y += enemy.speed;
                enemy.element.style.top = enemy.y + 'px';
                
                // Check if hit ground
                if (enemy.y >= window.innerHeight - 120) {
                    enemy.element.remove();
                    
                    health -= 10;
                    updateHealth();
                    
                    createExplosion(enemy.x + 15, enemy.y + 15);
                    
                    if (health <= 0) {
                        endGame();
                    }
                    
                    enemiesRemaining--;
                    checkWaveComplete();
                    
                    return false;
                }
                
                return true;
            });
        }

        function checkWaveComplete() {
            if (enemiesRemaining <= 0) {
                nextWave();
            }
        }

        function createExplosion(x, y) {
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            explosion.style.left = (x - 20) + 'px';
            explosion.style.top = (y - 20) + 'px';
            gameArea.appendChild(explosion);
            setTimeout(() => explosion.remove(), 400);
        }

        function showHitEffect(x, y, text) {
            const hitEffect = document.createElement('div');
            hitEffect.className = 'hit-effect';
            hitEffect.textContent = text;
            hitEffect.style.left = x + 'px';
            hitEffect.style.top = y + 'px';
            gameArea.appendChild(hitEffect);
            
            setTimeout(() => hitEffect.remove(), 600);
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        function updateWave() {
            document.getElementById('wave').textContent = wave;
        }

        function updateHealth() {
            if (health < 0) health = 0;
            document.getElementById('healthFill').style.width = health + '%';
        }

        function updateAmmo() {
            document.getElementById('ammo').textContent = ammo;
        }

        function endGame() {
            gameActive = false;
            clearInterval(spawnInterval);
            
            setTimeout(() => {
                enemies.forEach(e => e.element.remove());
                projectiles.forEach(p => p.element.remove());
                enemies = [];
                projectiles = [];
                
                document.getElementById('finalScore').textContent = score;
                document.getElementById('finalWave').textContent = wave;
                document.getElementById('endScreen').style.display = 'flex';
            }, 1000);
        }
    </script>
</body>
</html>
